<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3eadc">
<meta name="robots" content="noindex, nofollow">
<title>Pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a2b1f; --soft:#7a634c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#f3eadc; }
  body {
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
  }

  /* ---------- scène ---------- */
  /* la plage est dessinée derrière l'écran du code, d'abord noyée dans une brume de la même couleur */
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; opacity:0; }
  #scene.ready { opacity:1; }

  /* ---------- porte d'entrée ---------- */
  #gate { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(30px,6vh,52px);
    padding:24px 16px calc(24px + 8vh); }
  #gate .bg { position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%, #fcf8f1 0%, #f4ebdd 58%, #e9d8bf 100%);
    transition:opacity 1.1s ease; }
  #gate .bg::before { content:""; position:absolute; inset:0; opacity:.5; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #gate > :not(.bg) { position:relative; z-index:1; }
  #gate.out { pointer-events:none; }
  #gate.out .bg { opacity:0; }
  #title { position:relative; margin:0; font-weight:400; font-style:italic; text-align:center;
    font-size:clamp(36px,9.5vw,72px); line-height:1.08; color:var(--ink); letter-spacing:.005em;
    opacity:0; transform:translateY(8px); transition:opacity 1.4s ease .15s, transform 1.4s ease .15s; }
  #title.ready { opacity:1; transform:none; }
  #title .w { display:inline-block; white-space:nowrap; }
  #title .c { display:inline-block; white-space:pre; }

  .code { position:relative; display:flex; gap:clamp(5px,2vw,14px);
    opacity:0; transform:translateY(8px); transition:opacity 1.4s ease .45s, transform 1.4s ease .45s; }
  .code.ready { opacity:1; transform:none; }
  .box { width:clamp(34px,12vw,60px); height:clamp(48px,15.5vw,76px); border-radius:clamp(12px,3.6vw,16px);
    display:flex; align-items:center; justify-content:center; position:relative;
    font-size:clamp(30px,8vw,42px); font-weight:500; color:var(--ink);
    background:rgba(255,255,255,.55);
    box-shadow:inset 0 0 0 1px rgba(120,90,60,.16), 0 10px 24px -16px rgba(90,64,40,.5);
    transition:box-shadow .3s ease, background .3s ease, transform .3s ease; }
  .box.on { box-shadow:inset 0 0 0 1.5px rgba(150,112,70,.65), 0 12px 26px -14px rgba(90,64,40,.55); background:rgba(255,255,255,.75); }
  .box.on:empty::after { content:""; width:1.5px; height:42%; background:var(--soft); animation:blink 1.1s steps(1) infinite; }
  .box.filled { background:rgba(255,255,255,.72); }
  @keyframes blink { 50% { opacity:0; } }
  .code.busy .box { animation:breathe 1s ease-in-out infinite; }
  @keyframes breathe { 50% { background:rgba(255,248,236,.95); } }
  .code.bad { animation:shake .55s cubic-bezier(.36,.07,.19,.97); }
  .code.bad .box { box-shadow:inset 0 0 0 1.5px rgba(170,80,60,.55), 0 10px 24px -16px rgba(90,64,40,.5); }
  @keyframes shake { 15%,85% { transform:translateX(-2px);} 30%,70% { transform:translateX(5px);} 45%,55% { transform:translateX(-8px);} }
  #code { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; margin:0;
    font-size:16px; color:transparent; background:transparent; caret-color:transparent; outline:none; cursor:pointer; }

  .blow { animation:blow 1.7s cubic-bezier(.45,.05,.55,.95) var(--d) forwards; }
  @keyframes blow { 0% { transform:translate(0,0) rotate(0); opacity:1; filter:blur(0); }
    100% { transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0; filter:blur(3px); } }

  /* ---------- boutons ---------- */
  #ui { position:fixed; left:0; right:0; z-index:5; display:flex; justify-content:center; padding:0 16px;
    bottom:calc(env(safe-area-inset-bottom, 0px) + clamp(18px,4.5vh,40px)); pointer-events:none; }
  .card { pointer-events:none; opacity:0; transform:translateY(14px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1);
    background:rgba(255,251,244,.6); -webkit-backdrop-filter:blur(14px) saturate(1.15); backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:0 14px 34px -16px rgba(60,40,20,.55), inset 0 0 0 1px rgba(255,255,255,.6);
    color:var(--ink); }
  .card.show { opacity:1; transform:none; pointer-events:auto; }
  .card.gone { display:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #read { border-radius:999px; padding:13px 30px 14px; font-size:clamp(20px,5.2vw,23px); font-style:italic; }
  #confirm { border-radius:24px; padding:20px 20px 16px; text-align:center; max-width:360px; width:100%; }
  #confirm p { margin:0 0 16px; font-size:clamp(20px,5.4vw,23px); font-style:italic; line-height:1.25; }
  #confirm .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  #confirm button { border-radius:999px; padding:11px 20px 12px; font-size:19px; font-style:italic; }
  #no { color:var(--soft); }
  #yes { background:var(--ink); color:#fbf5ea; box-shadow:0 8px 18px -10px rgba(40,25,10,.7); }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="gate">
  <div class="bg"></div>
  <h1 id="title"></h1>
  <div class="code" id="codewrap">
    <div class="box"></div><div class="box"></div><div class="box"></div>
    <div class="box"></div><div class="box"></div><div class="box"></div>
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Code">
  </div>
</div>

<div id="ui">
  <button id="read" class="card gone">J’ai fini de lire</button>
  <div id="confirm" class="card gone" role="dialog" aria-live="polite">
    <p>Le poème va disparaître.<br>Tu es sûre&nbsp;?</p>
    <div class="row"><button id="no">Pas encore</button><button id="yes">Oui, je suis sûre</button></div>
  </div>
</div>

(function buildTitle() {

  // préparé dès le chargement de la page, pendant qu'elle tape le code

  /* ---------- mise en page du poème ---------- */
  const font = s => `600 ${s}px Caveat, "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive`;
  function layout() {
    const m = mk(8, 8).getContext('2d'); m.font = font(100);
    L = lines.map(txt => {
      const mm = /^(.*)\[(.)\](.*)$/.exec(txt);
      if (!mm) { const w = m.measureText(txt).width; return { txt, key: null, w, left: w / 2, right: w / 2 }; }
      const pre = mm[1], key = mm[2], post = mm[3];
      const wp = m.measureText(pre).width, wk = m.measureText(key).width, wpo = m.measureText(post).width;
      return { txt: pre + key + post, pre, key, post, wp, wk, wpo, left: wp + wk / 2, right: wk / 2 + wpo };
    });
    const half = Math.max(...L.map(l => Math.max(l.left, l.right)));
    const margin = Math.max(16, W * .045);
    const topMin = H * .19, botMax = H - Math.max(150, H * .21);   // place libre pour le bouton
    const Fw = (W / 2 - margin) / half * 100, Fh = Math.min(H * .6, botMax - topMin) / (L.length * 1.42);
    F = Math.min(Fw, Fh, 46); LH = F * 1.42; AXIS = W / 2;

    const s = F / 100;

      if (l.key) { l.x = AXIS - (l.wp + l.wk / 2) * s; l.kx = l.x + l.wp * s; l.px = l.kx + l.wk * s; l.hk = l.wk * s / 2; }
      else l.x = AXIS - l.w * s / 2;
    });

    idleMin = Math.max(BASEY + .05 * PXM, idleMax * .55);
    KS = LAMB.map(l => 2 * Math.PI / (l * PXM));
    TK = TL.map(l => 2 * Math.PI / (l * PXM));

    NX = xs.length; front = new Float32Array(NX); foamX = new Float32Array(NX); lY = new Float32Array(NX); lA = new Float32Array(NX); frontBuf = new Uint8Array(NX * 2 * 4);
    // emplacement des photos : de part et d'autre de la colonne du « je t'aime »
    const keyed = L.filter(l => l.key);
    const yTop = keyed[0].gt - .3 * F, yBot = keyed[keyed.length - 1].gb + .28 * F;
    const colW = Math.max(...keyed.map(l => l.hk)) + .45 * F;

    const gap = Math.max(10, W * .028);

    });
  }

  /* ---------- sillons des lettres (R : vers qui s'effacent, G : « je t'aime », gravé plus profond) ---------- */
  function buildTextTex() {
    const c = mk(cw, ch), g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, cw, ch);
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalCompositeOperation = 'lighter';
    g.font = font(F); g.lineJoin = 'round'; g.lineCap = 'round'; g.textBaseline = 'alphabetic';
    const paintN = () => L.forEach(l => { const dr = (str, x) => { if (!str) return; g.strokeText(str, x, l.base); g.fillText(str, x, l.base); };
      if (!l.key) dr(l.txt, l.x); else { dr(l.pre, l.x); dr(l.post, l.px); } });
    const paintK = () => L.forEach(l => { if (l.key) { g.strokeText(l.key, l.kx, l.base); g.fillText(l.key, l.kx, l.base); } });

  /* ---------- photos enfouies sous le poème ---------- */
  function makePrint(img, w, h) {
    const c = mk(w * objScale, h * objScale), g = c.getContext('2d'); g.scale(objScale, objScale);
    g.fillStyle = '#efebe2'; g.fillRect(0, 0, w, h);
    const b = w * .045, iw = w - 2 * b, ih = h - 2 * b;
    if (img) { const ar = img.width / img.height, tar = iw / ih; let sw, sh, sx, sy;
      if (ar > tar) { sh = img.height; sw = sh * tar; sx = (img.width - sw) / 2; sy = 0; } else { sw = img.width; sh = sw / tar; sx = 0; sy = (img.height - sh) / 2; }

    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, 'rgba(255,255,255,.12)'); gr.addColorStop(.45, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(30,20,10,.08)');

  }
  // tirage à moitié enterré : bord humide, et le vrai sable le recouvre en partie (on « troue » l'image)

    g.fillStyle = 'rgba(45,30,15,.3)'; g.fillRect(-w / 2 - 1.6, -h / 2 - 1.1, w + 3.2, h + 2.8);
    g.drawImage(pr.img, -w / 2, -h / 2, w, h);

    cover.moveTo(sideX + pr.side * 8, drift[0][1]); drift.forEach(p => cover.lineTo(p[0], p[1])); cover.lineTo(sideX + pr.side * 8, drift[drift.length - 1][1]); cover.closePath();

  /* ---------- vagues ---------- */
  // une vague = une nappe d'eau lancée sur la pente : elle ralentit, s'arrête un instant, redescend en accélérant.
  // Son bord forme des langues qui n'avancent pas toutes au même rythme.

  function computeFront() {
    for (let i = 0; i < NX; i++) { front[i] = baseY(xs[i], t); foamX[i] = .25; }

    p.lineTo(W + STEP * 3, -40); p.closePath(); return p;

  function uploadFront() {

  /* ---------- masques ---------- */
  function fade(x, c, a) { x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-out'; x.fillStyle = `rgba(0,0,0,${a})`; x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = 'source-over'; }
  function paint(x, c, path, a) { x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0); x.fillStyle = `rgba(255,255,255,${a})`; x.fill(path); }

  /* ---------- boucle ---------- */
  function frame(now) {
    if (!running) return;
    const raw = Math.max(0, (now - last) / 1000); last = now;
    const dt = Math.min(.1, raw); t += dt;
    if (introStart >= 0) intro = clamp((now - introStart) / 3200, 0, 1);
    adapt(raw);
    schedule();
    computeFront();
    const water = waterPath();
    // humidité (sèche lentement) et effacement des sillons
    wetAcc += dt; if (wetAcc > .2) { fade(wetX, wetC, 1 - Math.exp(-wetAcc / 14)); wetAcc = 0; }
    paint(wetX, wetC, water, 1);
    let maxY = 0; for (let i = 0; i < NX; i++) if (front[i] > maxY) maxY = front[i];
    const touching = maxY > L[0].gt - 4;
    if (touching) paint(erX, erC, water, 1 - Math.pow(.9, dt * 60));
    // la grande vague emporte la fine couche de sable qui cachait les photos
    const big = seqWaves && t >= seqWaves.w3.t0 && t <= wEnd(seqWaves.w3);
    if (big) paint(rvX, rvC, water, 1 - Math.pow(.955, dt * 60));
    uploadFront(); upload(TX.wet, wetC); if (touching) upload(TX.er, erC); if (big) upload(TX.rev, rvC);
    // rendu
    gl.viewport(0, 0, cw, ch); gl.useProgram(P.p);
    [TX.sand, TX.text, TX.er, TX.wet, TX.rev, TX.front, TX.noise, TX.obj].forEach((tx, i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tx); });
    const u = P.u;
    gl.uniform2f(u.uRes, cw, ch); gl.uniform2f(u.uCss, W, H);
    gl.uniform1f(u.uTime, t); gl.uniform1f(u.uPxm, PXM); gl.uniform1f(u.uN, NX); gl.uniform1f(u.uStep, STEP);
    gl.uniform1f(u.uSeaY, BASEY * 2.6); gl.uniform1f(u.uGD, .68); gl.uniform1f(u.uNS, 2.2 * DPR); gl.uniform1f(u.uIntro, intro);
    drawQuad(); gl.activeTexture(gl.TEXTURE0);
    requestAnimationFrame(frame);
  }
  // si l'appareil peine, on baisse un peu la résolution (avant que les vagues commencent)
  function adapt(raw) {
    if (perf.done || seq !== 'idle' || intro < 1) return;
    perf.n++; if (perf.n < 20) return; perf.sum += raw;
    if (perf.n >= 110) {
      const avg = perf.sum / 90; perf.done = true;
      if (avg > 1 / 42 && DPR > 1.05) { MAXDPR = Math.max(1, DPR * (avg > 1 / 25 ? .6 : .75)); perf = { n: 0, sum: 0, done: false }; build(false); }
    }
  }

  /* ---------- construction ---------- */
  function build(finalState) {
    W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, MAXDPR);
    cw = Math.round(W * DPR); ch = Math.round(H * DPR); cv.width = cw; cv.height = ch;
    builtW = W; builtH = H;
    layout(); bakeSand(); buildTextTex();
    erC = mk(W / 2, H / 2); erX = erC.getContext('2d');
    wetC = mk(W / 4, H / 4); wetX = wetC.getContext('2d');
    rvC = mk(W / 4, H / 4); rvX = rvC.getContext('2d');
    const g = wetX.createLinearGradient(0, 0, 0, idleMax * 1.25 * wetC.height / H);
    g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(.7, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    wetX.fillStyle = g; wetX.fillRect(0, 0, wetC.width, wetC.height);
    // les photos sont là dès le début, enfouies : invisibles tant que la mer ne les découvre pas
    objScale = Math.min(DPR, 1.5); objC = mk(W * objScale, H * objScale);
    const og = objC.getContext('2d');
    prints.forEach((pr, i) => { pr.img = makePrint(photos[i], pr.w, pr.h); bury(og, pr); });
    if (finalState) {
      erX.fillStyle = '#fff'; erX.fillRect(0, 0, erC.width, erC.height);
      rvX.fillStyle = '#fff'; rvX.fillRect(0, 0, rvC.width, rvC.height);
    }
    upload(TX.er, erC); upload(TX.wet, wetC); upload(TX.rev, rvC); upload(TX.obj, objC);
  }
  let rz = null;
  window.addEventListener('resize', () => {
    if (!running) return; clearTimeout(rz);
    rz = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      if (Math.abs(w - builtW) < 2 && Math.abs(h - builtH) < builtH * .12) return;
      if (seq === 'running') { seq = 'done'; nextIdle = t + 1; try { localStorage.setItem(STORE, '1'); } catch (e) {} }
      waves = waves.filter(wv => wv.kind === 'idle');
      build(seq === 'done');
    }, 250);
  });
  function fallback(ls) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;padding:24px;font:600 22px/1.5 Caveat,cursive;color:#5a4128;background:#e6d3b0';
    d.textContent = ls.map(s => s.replace(/[\[\]]/g, '')).join('\n'); document.body.appendChild(d);
  }

  return {
    prepare() { if (!gl) return; try { initGL(); } catch (e) { console.error(e); gl = null; } },
    // construit la plage et affiche sa première image (encore dans la brume) ; résout quand c'est prêt
    init(ls, imgs) {
      lines = ls; photos = imgs;
      if (!gl) { fallback(ls); return Promise.resolve(false); }
      try { initGL(); build(false); } catch (e) { console.error(e); fallback(ls); return Promise.resolve(false); }
      running = true; last = performance.now(); requestAnimationFrame(frame);
      return new Promise(res => requestAnimationFrame(() => requestAnimationFrame(() => res(true))));
    },
    reveal() { if (introStart < 0) introStart = performance.now(); },
    requestSequence() { if (seq === 'idle') seq = 'requested'; }
  };
})();
})();
</script>
</body>
</html>
